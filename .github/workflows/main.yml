name: Build and Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compilar proyecto
        shell: cmd
        run: build.bat

      - name: Generar nombre del tag
        id: vars
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd-HHmmss"
          "tag=v1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Crear tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag ${{ steps.vars.outputs.tag }}
          git push origin ${{ steps.vars.outputs.tag }}

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (!(Test-Path "build/ProjectMaker.exe")) {
            throw "No se encontró build/ProjectMaker.exe"
          }

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: |
            Compilación automática de Tridingine-3DSlib.

            Ejecutable generado tras actualizar la rama main.
          draft: false
          prerelease: false
          files: build/ProjectMaker.exe
